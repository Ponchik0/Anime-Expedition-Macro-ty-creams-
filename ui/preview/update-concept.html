<!doctype html>
<html lang="ru" data-theme-base="black">
<head>
<meta charset="utf-8">
<title>Концепт: уведомление об обновлении и окно обновления</title>
<!-- КОНЦЕПТ, А НЕ ЧАСТЬ ПРИЛОЖЕНИЯ.
     index.html о файле не знает, app.js его не грузит. Открывается двойным
     щелчком. Токены берутся из настоящего ../style.css, тема чёрная — та же,
     что теперь стоит по умолчанию.

     ЧТО РЕШАЕТСЯ

     1. ОБ ОБНОВЛЕНИИ НЕ СООБЩАЕТСЯ НИГДЕ, КРОМЕ МОДАЛКИ. Она показывается
        один раз при запуске; закрыл «Позже» — и следа не осталось. Бейдж
        версии в шапке выглядит одинаково и когда всё свежее, и когда вышла
        новая версия. Здесь бейдж сам становится уведомлением: он и так
        показывает твою версию, ему и сообщать, что есть новее.

     2. ЗАМЕТКИ РЕЛИЗА ПОКАЗЫВАЮТСЯ СЫРЫМ MARKDOWN. app.js:252 кладёт их
        через textContent при white-space: pre-wrap. Пока описания были
        простым текстом, это работало. Теперь мы пишем «### Установка» и
        «- `новое` **Нормальный установщик**» — и человек видит решётки,
        звёздочки и обратные кавычки как есть. Ниже — разбор того
        подмножества, которым мы реально пользуемся.

     3. НЕ ВИДНО, СКОЛЬКО КАЧАТЬ. 115 МБ на медленном канале это минуты, а
        кнопка просто говорит «Обновить и перезапустить».

     ЧЕГО ЗДЕСЬ НЕТ намеренно: новых цветов, свечений, анимаций ради
     анимаций. Форма модалки, отступы и типографика — те же, что в
     приложении; меняется структура, а не язык оформления. -->
<link rel="stylesheet" href="../style.css">
<style>
  body {
    margin: 0; padding: 20px;
    background: var(--bg-deep); color: var(--text);
    font-family: var(--font); font-size: 13px;
  }
  .pv-bar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s4); }
  .pv-title { font-size: 13px; font-weight: 600; margin-right: var(--s2); }
  .pv-btn {
    padding: var(--s1) var(--s3); border-radius: var(--r-md);
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-dim); font: inherit; cursor: pointer;
    transition: border-color var(--t-hover) var(--ease), color var(--t-hover) var(--ease);
  }
  .pv-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .pv-btn.is-on { border-color: var(--accent); color: var(--accent); }
  .pv-note { color: var(--text-muted); font-size: 12px; margin: var(--s5) 0 var(--s2); }

  /* ─── Шапка приложения (кусок, ради бейджа) ─────────────────────────── */
  .bar {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s2) var(--s3);
    border: 1px solid var(--border); border-radius: var(--r-md);
    background: var(--bg-card);
  }
  .bar-name { font-size: 13px; font-weight: 600; }

  .ver {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px var(--s2);
    border: 1px solid var(--border); border-radius: var(--r-md);
    background: var(--bg-surface);
    color: var(--text-muted);
    font-family: var(--font-mono); font-size: 11px;
    cursor: pointer;
    transition: border-color var(--t-hover) var(--ease), color var(--t-hover) var(--ease);
  }
  .ver:hover { border-color: var(--border-strong); color: var(--text); }

  /* Есть обновление: тот же бейдж, но подсвечен и показывает, КУДА обновит.
     Отдельный значок рядом не нужен — версия и новость о версии это одно и
     то же сообщение, и разносить их значит занимать два места вместо одного. */
  .ver.has-update {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-wash);
  }
  .ver-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    display: none;
  }
  .ver.has-update .ver-dot { display: block; animation: pulse 2.4s var(--ease) infinite; }
  /* Пульс медленный и слабый: это не тревога, обновление может подождать. */
  @keyframes pulse { 50% { opacity: 0.35; } }
  .ver-arrow { display: none; }
  .ver.has-update .ver-arrow { display: inline; }

  /* ─── Окно обновления ───────────────────────────────────────────────── */
  .panel {
    width: 420px;
    border: 1px solid var(--border); border-radius: var(--r-lg);
    background: var(--bg-card);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s3) var(--s4);
    border-bottom: 1px solid var(--border);
  }
  .panel-title { font-size: 13px; font-weight: 600; }
  .panel-x { color: var(--text-muted); cursor: pointer; font-size: 16px; line-height: 1; }
  .panel-x:hover { color: var(--text); }
  .panel-body { padding: var(--s4); }

  /* Переход версий: видно, откуда и куда. «Доступна 1.1.4» без «у тебя
     1.1.3» не отвечает на вопрос «а мне вообще надо?». */
  .jump { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
  .jump-from { color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; }
  .jump-arrow { color: var(--text-muted); }
  .jump-to {
    font-family: var(--font-mono); font-size: 13px; font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent-line); border-radius: var(--r-sm);
    padding: 1px var(--s2);
  }
  .jump-size { margin-left: auto; color: var(--text-muted); font-size: 11px; }

  /* Заметки. Высота ограничена, но не 160px: описания стали длиннее, и
     полтора видимых пункта из десяти — это не «кратко», а «не прочитать». */
  .notes {
    max-height: 260px; overflow-y: auto;
    margin: var(--s4) 0;
    padding-right: var(--s2);
  }
  .notes h4 {
    margin: var(--s4) 0 var(--s2); font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    padding-bottom: 3px; border-bottom: 1px solid var(--border);
  }
  .notes h4:first-child { margin-top: 0; }
  .notes p { margin: 0 0 var(--s3); color: var(--text-dim); font-size: 12px; line-height: 1.5; }
  .notes ul { margin: 0; padding: 0; list-style: none; }
  .notes li {
    display: flex; gap: var(--s2); align-items: baseline;
    padding: 4px 0; font-size: 12px; color: var(--text-muted); line-height: 1.5;
  }
  .notes li b { color: var(--text); font-weight: 600; }
  .li-text { min-width: 0; }
  /* Пометки «новое» и «фикс» — теми же серыми, что и всё остальное.
     Красить их в зелёный и красный было бы соблазнительно и неверно: эти два
     цвета в приложении уже заняты под «работает» и «ошибка», и третий смысл
     сделал бы оба менее читаемыми. */
  .tag {
    flex-shrink: 0; min-width: 42px; text-align: center;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 0 4px;
  }
  .tag.new { color: var(--text); border-color: var(--border-strong); }

  .row { display: flex; align-items: center; gap: var(--s2); justify-content: flex-end; }
  .btn {
    padding: 6px var(--s4); border-radius: var(--r-md);
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-dim); font: inherit; font-size: 12px; cursor: pointer;
    transition: border-color var(--t-hover) var(--ease), color var(--t-hover) var(--ease);
  }
  .btn:hover { border-color: var(--border-strong); color: var(--text); }
  .btn-main {
    background: var(--accent); border-color: var(--accent);
    color: var(--bg-deep); font-weight: 600;
  }
  .btn-main:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--bg-deep); }

  /* Скачивание. Полоса через transform, а не width: ширина заставляет
     браузер пересчитывать раскладку на каждом кадре. */
  .dl { margin: var(--s4) 0; }
  .dl-track { height: 6px; border-radius: 3px; background: var(--bg-field); overflow: hidden; }
  .dl-fill {
    height: 100%; background: var(--accent); border-radius: 3px;
    transform-origin: left; transform: scaleX(0);
    transition: transform 200ms linear;
  }
  .dl-text {
    display: flex; justify-content: space-between;
    margin-top: var(--s2); font-size: 11px; color: var(--text-muted);
    font-family: var(--font-mono);
  }
  .hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .ver.has-update .ver-dot { animation: none; }
    .dl-fill { transition: none; }
  }
</style>
</head>
<body>

<div class="pv-bar">
  <span class="pv-title">Уведомление об обновлении</span>
  <button class="pv-btn" id="b-idle">Всё свежее</button>
  <button class="pv-btn is-on" id="b-avail">Есть обновление</button>
  <button class="pv-btn" id="b-dl">Скачивание</button>
</div>

<div class="pv-note">Шапка приложения — бейдж версии сам становится уведомлением:</div>
<div class="bar">
  <span class="bar-name">Anime Expeditions</span>
  <span class="ver" id="ver" title="Нажми, чтобы проверить обновления">
    <span class="ver-dot"></span>
    <span id="ver-text">v1.1.3</span>
    <span class="ver-arrow">→ 1.1.4</span>
  </span>
</div>

<div class="pv-note">Окно обновления:</div>
<div class="panel">
  <div class="panel-head">
    <span class="panel-title">Доступно обновление</span>
    <span class="panel-x">&times;</span>
  </div>
  <div class="panel-body">
    <div class="jump">
      <span class="jump-from">1.1.3</span>
      <span class="jump-arrow">→</span>
      <span class="jump-to">1.1.4</span>
      <span class="jump-size">114.5 МБ</span>
    </div>

    <div class="notes" id="notes"></div>

    <div class="dl hidden" id="dl">
      <div class="dl-track"><div class="dl-fill" id="dl-fill"></div></div>
      <div class="dl-text"><span id="dl-done">0 МБ</span><span id="dl-total">из 114.5 МБ</span></div>
    </div>

    <div class="row" id="actions">
      <button class="btn">Позже</button>
      <button class="btn btn-main">Обновить и перезапустить</button>
    </div>
  </div>
</div>

<script>
// Настоящее описание релиза v1.1.4 — ровно то, что лежит в теге.
const NOTES = `Теперь у макроса есть установщик, а интерфейс встречает чёрно-белым.

### Установка
- \`новое\` **Нормальный установщик** — спрашивает папку, делает ярлыки, показывает прогресс в мегабайтах.
- \`новое\` **Ставится в свою папку**, а не вываливается поверх всего, что там лежит.
- \`новое\` **Удаляется как обычная программа**. Настройки и шаблоны при этом сохраняются.

### Интерфейс
- \`новое\` **Чёрно-белая тема по умолчанию**. Фон меняется в «Настройки → Кастомизация».
- \`фикс\` **Экран первого запуска наконец выглядит как экран** — у него не было ни одного стиля.

### Под капотом
- \`фикс\` **Ярлыки не создавались вообще** — ни один.`;

// Разбор ТОЛЬКО того подмножества markdown, которым мы реально пишем описания:
// «### заголовок», «- пункт», **жирный**, `код`. Полноценный парсер сюда не
// нужен и опасен: это чужой текст, приходящий из сети, и чем меньше он может,
// тем меньше с ним проблем. Всё, что не распознано, остаётся обычным текстом.
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}

// Пункт списка = пометка слева + весь остальной текст ОДНИМ блоком.
// Иначе <b> и текст вокруг него становятся отдельными flex-элементами, и
// строка разъезжается: жирное начало переносится само по себе, а хвост
// прилипает сбоку.
function listItem(body) {
  const m = body.match(/^`([^`]+)`\s*/);
  const tag = m
    ? `<span class="tag ${m[1] === 'новое' ? 'new' : ''}">${esc(m[1])}</span>`
    : '<span class="tag" style="visibility:hidden"></span>';
  return `<li>${tag}<span class="li-text">${inline(m ? body.slice(m[0].length) : body)}</span></li>`;
}
function render(md) {
  const out = [];
  let list = false;
  for (const raw of md.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('### ')) {
      if (list) { out.push('</ul>'); list = false; }
      out.push(`<h4>${esc(line.slice(4))}</h4>`);
    } else if (line.startsWith('- ')) {
      if (!list) { out.push('<ul>'); list = true; }
      out.push(listItem(line.slice(2)));
    } else {
      if (list) { out.push('</ul>'); list = false; }
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  if (list) out.push('</ul>');
  return out.join('');
}
document.getElementById('notes').innerHTML = render(NOTES);


const ver = document.getElementById('ver');
// Стартовое состояние должно совпадать с подсвеченной кнопкой в панели
// сверху, иначе превью открывается с противоречием: кнопка говорит «есть
// обновление», а бейдж выглядит спокойным.
ver.classList.add('has-update');
const setOn = b => { document.querySelectorAll('.pv-bar .pv-btn').forEach(x => x.classList.remove('is-on')); b.classList.add('is-on'); };

document.getElementById('b-idle').onclick = e => {
  ver.classList.remove('has-update');
  document.getElementById('ver-text').textContent = 'v1.1.4';
  setOn(e.currentTarget);
};
document.getElementById('b-avail').onclick = e => {
  ver.classList.add('has-update');
  document.getElementById('ver-text').textContent = 'v1.1.3';
  document.getElementById('dl').classList.add('hidden');
  document.getElementById('actions').classList.remove('hidden');
  document.getElementById('notes').classList.remove('hidden');
  setOn(e.currentTarget);
};
document.getElementById('b-dl').onclick = e => {
  setOn(e.currentTarget);
  document.getElementById('notes').classList.add('hidden');
  document.getElementById('actions').classList.add('hidden');
  document.getElementById('dl').classList.remove('hidden');
  let mb = 0;
  const total = 114.5, fill = document.getElementById('dl-fill');
  clearInterval(window._t);
  window._t = setInterval(() => {
    mb = Math.min(total, mb + 6.4);
    fill.style.transform = `scaleX(${mb / total})`;
    document.getElementById('dl-done').textContent = mb.toFixed(1) + ' МБ';
    if (mb >= total) clearInterval(window._t);
  }, 220);
};
</script>
</body>
</html>
